# The mining skill. See the README (Rules) for how rules work; unknown ids are left out with a note in the log.

# The name shown in chat, with & color codes
name = "&7Mining"
max-level = 99
# Total experience needed for level L
level-formula = "1/8L(L-1)+75((2^((L-1)/7)-1)/(1-2^(-(1/7))))"
# Money paid for a rule with "money = M" at level L (leave out for no money)
economy-formula = "(L/100)+M"

# Launched when a player levels up (four at the max level). Shapes: small_ball, large_ball, star, creeper, burst
level-up-firework {
  shape = star
  colors = ["#555555", "#00FFFF"]
  fade-colors = ["#555555", "#00FFFF"]
  flicker = false
  trail = false
}

# Within a trigger the first rule (top to bottom) that matches a block or item wins.
groups = [
  {
    trigger = use-tool
    deny = use
    rules = [
      { items = ["minecraft:stone_pickaxe"], level = 5 }
      { items = ["minecraft:iron_pickaxe"], level = 10 }
      { items = ["minecraft:golden_pickaxe"], level = 20 }
      { items = ["minecraft:diamond_pickaxe"], level = 30 }
    ]
  }
  {
    trigger = break
    creator = natural
    deny = break
    rules = [
