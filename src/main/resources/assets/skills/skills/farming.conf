# The farming skill. See the README (Rules) for how rules work; unknown ids are left out with a note in the log.

# The name shown in chat, with & color codes
name = "&2Farming"
max-level = 99
# Total experience needed for level L
level-formula = "1/8L(L-1)+75((2^((L-1)/7)-1)/(1-2^(-(1/7))))"
# Money paid for a rule with "money = M" at level L (leave out for no money)
economy-formula = "(L/100)+M"

# Launched when a player levels up (four at the max level). Shapes: small_ball, large_ball, star, creeper, burst
level-up-firework {
  shape = star
  colors = ["#006400", "#008000"]
  fade-colors = ["#006400", "#008000"]
  flicker = false
  trail = false
}

