# The digger skill. See the README (Rules) for how rules work; unknown ids are left out with a note in the log.

# The name shown in chat, with & color codes
name = "&6Digger"
max-level = 99
# Total experience needed for level L
level-formula = "1/8L(L-1)+75((2^((L-1)/7)-1)/(1-2^(-(1/7))))"
# Money paid for a rule with "money = M" at level L (leave out for no money)
economy-formula = "(L/100)+M"

# Launched when a player levels up (four at the max level). Shapes: small_ball, large_ball, star, creeper, burst
level-up-firework {
  shape = star
  colors = ["#A52A2A", "#008000"]
  fade-colors = ["#A52A2A", "#008000"]
  flicker = false
  trail = false
}

# Within a trigger the first rule (top to bottom) that matches a block or item wins.
groups = [
  {
    trigger = use-tool
    deny = use
    rules = [
      { items = ["minecraft:stone_shovel"], level = 5 }
      { items = ["minecraft:iron_shovel"], level = 10 }
      { items = ["minecraft:golden_shovel"], level = 20 }
      { items = ["minecraft:diamond_shovel"], level = 30 }
    ]
  }
  {
    trigger = break
    creator = natural
    deny = break
    rules = [
      { blocks = ["minecraft:snow"], xp = 0.5, money = 0.05 }
      { blocks = ["minecraft:snow_block"], xp = 1.5, money = 0.05 }
      { blocks = ["minecraft:dirt", "minecraft:coarse_dirt", "minecraft:podzol"], xp = 2.5, money = 0.1 }
      { blocks = ["minecraft:grass_block"], xp = 2.5, money = 0.15 }
      { blocks = ["minecraft:sand", "minecraft:red_sand"], level = 5, xp = 5, money = 0.25 }
      { blocks = ["minecraft:gravel"], level = 5, xp = 6, money = 0.35 }
      { blocks = ["minecraft:clay"], level = 10, xp = 6, money = 0.15 }
      { blocks = ["minecraft:mycelium"], level = 10, xp = 6, money = 0.25 }
      { blocks = ["minecraft:white_concrete_powder", "minecraft:orange_concrete_powder", "minecraft:magenta_concrete_powder", "minecraft:light_blue_concrete_powder", "minecraft:yellow_concrete_powder", "minecraft:lime_concrete_powder", "minecraft:pink_concrete_powder", "minecraft:gray_concrete_powder", "minecraft:light_gray_concrete_powder", "minecraft:cyan_concrete_powder", "minecraft:purple_concrete_powder", "minecraft:blue_concrete_powder", "minecraft:brown_concrete_powder", "minecraft:green_concrete_powder", "minecraft:red_concrete_powder", "minecraft:black_concrete_powder"], level = 10, xp = 6, money = 0.25 }
      { blocks = ["minecraft:soul_sand"], level = 15, xp = 7, money = 0.35 }
      { blocks = ["minecraft:dirt_path"], level = 20, xp = 7.5, money = 0.35 }
    ]
  }
]
