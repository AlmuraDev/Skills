# Skills main configuration.
# The skills themselves (names, formulas, rules) are in the "skills" folder next to this file, one file per skill.

database {
  # The H2 database file holding everyone's experience, relative to the server folder. Leave out the ".mv.db" extension.
  file = "./config/skills/skills-h2"
}

# Worlds that use the skills of another world: "world key" = "world key it uses".
# By default the Nether and The End use the Overworld's skills. A world not listed has skills of its own.
container-share {
  "minecraft:the_nether" = "minecraft:overworld"
  "minecraft:the_end" = "minecraft:overworld"
}

# Seconds between saves of the online players' experience (it is also saved when they leave or change worlds).
save-interval = 60
