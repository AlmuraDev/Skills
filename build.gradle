plugins {
    id 'java'
    id 'com.gradleup.shadow' version "${shadow_version}"
}

base {
    archivesName = 'Skills'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

repositories {
    mavenCentral()
    maven {
        name = 'Sponge'
        url = uri('https://repo.spongepowered.org/repository/maven-public/')
        content {
            includeGroup('org.spongepowered')
        }
    }
}

configurations {
    // Jars packed into the plugin jar as plain files (META-INF/skills/libs), not on the class path
    bundledH2 { transitive = false }
}

dependencies {
    // SpongeNeo brings SpongeAPI (with Adventure, Configurate, Guice, Gson and Log4j) at run time
    compileOnly("org.spongepowered:spongeapi:${sponge_api_version}")

    implementation("net.objecthunter:exp4j:${exp4j_version}")

    bundledH2("com.h2database:h2:${h2_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
    options.compilerArgs << '-Xlint:deprecation'
}

def pluginProps = [
        'version'           : project.version,
        'sponge_api_version': sponge_api_version.replace('-SNAPSHOT', ''),
        'h2_version'        : h2_version
]

processResources {
    inputs.properties(pluginProps)
    filesMatching(['META-INF/sponge_plugins.json', 'skills-build.properties']) {
        expand(pluginProps)
    }
    into('META-INF/skills/libs') {
        from(configurations.bundledH2) { rename { "h2-${h2_version}.jar" } }
    }
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.runtimeClasspath]
    relocate 'net.objecthunter.exp4j', 'org.inspirenxe.skills.libs.exp4j'
    manifest {
        attributes(
                'Specification-Title': 'Skills',
                'Implementation-Title': 'Skills',
                'Implementation-Version': project.version
        )
    }
}

jar {
    archiveClassifier = 'slim'
}

assemble.dependsOn shadowJar
